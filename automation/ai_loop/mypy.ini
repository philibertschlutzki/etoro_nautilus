# automation/ai_loop/mypy.ini
# Issue #1105 — scope: automation/ai_loop/workspace/ ONLY.
#
# automation/ai_loop/validator.py::StaticValidator.run_linters passes THIS file explicitly via
# `mypy --strict --config-file automation/ai_loop/mypy.ini <one candidate file>` — it type-checks
# exactly one file under automation/ai_loop/workspace/candidates/ per call, never the whole
# automation/ai_loop package and never automation/strategies/. The repo has no root-level
# pyproject.toml/mypy.ini, so this file is never picked up by ambient/repo-wide mypy discovery
# either — it only applies when a caller points --config-file at it directly.
[mypy]
# --strict is passed on the CLI by validator.py (kept there, not duplicated here, so a caller
# invoking mypy directly with this config file still sees the intended strictness explicitly).
# nautilus_trader/automation.* are real project dependencies but are not necessarily installed
# in every environment that runs the validator (nautilus_trader requires Python 3.12+, see
# automation/requirements.txt) — missing stubs/imports for THOSE modules must not make every
# candidate fail mypy for a reason unrelated to the candidate's own code quality.
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False

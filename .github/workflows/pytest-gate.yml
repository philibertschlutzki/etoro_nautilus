name: PR Merge Gate - Test Suite

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r automation/requirements.txt

      # ── Tier 1: Architecture & Isolation (must never break) ──────────────────
      - name: Architecture isolation (Standalone-Prinzip §4)
        run: python3 -m pytest automation/tests/test_automation_isolation.py -v --timeout=30

      # ── Tier 2: Data pipeline & encoding (FSB16, precision) ──────────────────
      - name: FSB16 roundtrip encoding (§9, Pitfall #29)
        run: python3 -m pytest automation/tests/test_fsb16_roundtrip.py -v --timeout=60

      - name: Precision fallback logic (§8, Pitfalls #14/#23/#27/#36)
        run: python3 -m pytest automation/tests/test_size_precision_fixes.py automation/tests/test_api_precisions.py -v --timeout=30

      - name: Precision mismatch in backtest (Pitfall #36)
        run: python3 -m pytest automation/tests/test_precision_mismatch.py -v --timeout=120

      # ── Tier 3: Core backtest engine (backtest_runner.py) ────────────────────

      - name: Worker Lazy Imports Execution (Pitfall #63)
        run: python3 -m pytest automation/tests/test_worker_lazy_imports.py -v --timeout=30

      - name: Runner Env-Isolation & Manifest Contract
        run: python3 -m pytest automation/tests/test_runner_env_isolation.py automation/tests/test_runner_manifest_contract.py automation/tests/test_runner_fold_sortinos.py -v --timeout=30

      - name: Runner universe restriction — restrict_universe (A4.2)
        run: python3 -m pytest automation/tests/test_runner_instrument_filter.py -v --timeout=30

      - name: Orchestrator CLI args (--no-deploy vs dry-run)
        run: python3 -m pytest automation/tests/test_orchestrator_cli.py -v --timeout=30

      - name: Backtest runner core metrics & scoring (§10, §13)
        run: python3 -m pytest automation/tests/test_backtest_runner.py -v --timeout=120

      - name: Backtest worker fatal crash fail-fast (Issue #355)
        run: python3 -m pytest automation/tests/test_backtest_fatal_worker_crash.py -v --timeout=30

      - name: Backtest bar type (1-HOUR, Pitfall #28)
        run: python3 -m pytest automation/tests/test_backtest_runner_bar_type.py -v --timeout=120

      - name: Backtest trades generated — no zero-trade silent failure (§18)
        run: python3 -m pytest automation/tests/test_backtest_trades_generated.py -v --timeout=120

      - name: Balance crash regression (Pitfall #39)
        run: python3 -m pytest automation/tests/test_balance_crash_regression.py -v --timeout=120

      - name: Strategy uniqueness — no degenerate duplicate metrics (§13)
        run: python3 -m pytest automation/tests/test_strategy_duplication.py -v --timeout=180

      # ── Tier 4: Tournament & OOS gating ─────────────────────────────────────
      - name: Tournament config validation (§7, §10)
        run: python3 -m pytest automation/tests/test_tournament_validation.py -v --timeout=30

      - name: OOS gate — fail-closed live deployment (§11, §13, Pitfall #45)
        run: python3 -m pytest automation/tests/test_oos_gate.py -v --timeout=120

      - name: OOS aggregation math (Pitfall #45 / Issue #255)
        run: python3 -m pytest automation/tests/test_oos_aggregation.py -v --timeout=60

      - name: OOS result structure — sibling key rule (Pitfall #45 / Issue #172)
        run: python3 -m pytest automation/tests/test_issue_172.py -v --timeout=30

      # ── Tier 5: Strategy layer (§6) ──────────────────────────────────────────
      - name: Position sizing precedence (§6, Issue #182)
        run: python3 -m pytest automation/tests/test_sizing_precedence.py -v --timeout=30

      - name: Keltner ATR period parameter wiring (§6, AGENTS.md KeltnerChannel fix)
        run: python3 -m pytest automation/tests/test_keltner_atr_period.py -v --timeout=120

      - name: Flash crash reversal exits (§6, Issue #84)
        run: python3 -m pytest automation/tests/test_flash_crash_exits.py -v --timeout=30

      - name: VWAP exhaustion state mutation safety (§6, Pitfall #41 / Issue #211)
        run: python3 -m pytest automation/tests/test_vwap_exhaustion_state.py -v --timeout=30

      - name: ComboTrendVwap conjunction switches (§6/§7, ISSUE-OPT-373)
        run: python3 -m pytest automation/tests/test_combo_conjunction_switches.py -v --timeout=30

      # ── Tier 6: Live path (§11, §5.7) ────────────────────────────────────────
      - name: Live strategy mapping & registry (§11, Pitfall #22)
        run: python3 -m pytest automation/tests/test_live_strategy_mapping.py -v --timeout=30

      - name: Live execution safety defaults — demo mode & trend filter (§11)
        run: python3 -m pytest automation/tests/test_live_execution_defaults.py -v --timeout=60

      - name: Live allocator — no-interference & dollar floor (§5.7)
        run: python3 -m pytest automation/tests/test_allocator.py automation/tests/test_live_allocator_smoke.py -v --timeout=30

      # ── Tier 7: Infrastructure (§5.1, §5.9) ──────────────────────────────────
      - name: Catalog service — os._exit convention & flush (§5.1)
        run: python3 -m pytest automation/tests/test_catalog_service.py -v --timeout=60

      - name: Log manager — JSON events & cleanup (§5.9)
        run: python3 -m pytest automation/tests/test_log_manager.py -v --timeout=30

      # ── Tier 8: Orchestrator & phase 1 ───────────────────────────────────────
      - name: Orchestrator phase 1 — universe fetch & stale check (§5.2, §3)
        run: python3 -m pytest automation/tests/test_orchestrator_phase1.py -v --timeout=30

      # ── Tier 9: Config & Dry-Run ─────────────────────────────────────────────
      - name: Backtest runner config dry-run (Pitfall #52)
        run: python3 -m automation.backtest_runner --dry-run --config automation/config/strategies.json

      # ── Tier 10: Optimizer ──────────────────────────────────────────────────
      - name: Optimizer numeric search-space bounds extractor (A4.0)
        run: python3 -m pytest automation/tests/test_optimizer_bounds.py -q

      - name: Optimizer instrument_overrides resolution (A4.1)
        run: python3 -m pytest automation/tests/test_resolve_instrument_override.py -q

      - name: Optimizer manifest instruments filter (A4.2)
        run: python3 -m pytest automation/tests/test_trial_instruments_manifest.py -q

      - name: Optimizer per-symbol reward — param_pen / coverage drop (A4.3)
        run: python3 -m pytest automation/tests/test_reward_per_symbol.py -q

      - name: Optimizer Gate 1 — data sufficiency is_symbol_tunable (A4.4)
        run: python3 -m pytest automation/tests/test_symbol_tunable_gate.py -q

      - name: Optimizer single-symbol study + Gate 2 warm-start (A4.5a)
        run: python3 -m pytest automation/tests/test_optimize_symbol.py -q

      - name: Optimizer Gate 3 — per-symbol promotion margin (A4.5b)
        run: python3 -m pytest automation/tests/test_per_symbol_promotion.py -q

      - name: Optimizer sweep meta-orchestrator — enumeration/dispatch (A4.6)
        run: python3 -m pytest automation/tests/test_sweep_enumeration.py -q

      - name: Optimizer configurable storage URL resolution (A4.7)
        run: python3 -m pytest automation/tests/test_storage_url_resolution.py -q

      - name: Optimizer Configuration and Manifest Rules
        run: python3 -m pytest automation/tests/test_optimizer_manifest.py -q

      - name: Optimizer Runner, Parser and Configured Reward
        run: python3 -m pytest automation/tests/test_optimizer_runner.py automation/tests/test_optimizer_reward_parser.py -q

      - name: Optimizer Loop, Holdout and DB
        run: python3 -m pytest automation/tests/test_optimizer_loop.py -q
